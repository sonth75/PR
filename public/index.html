<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Speed Master - Player</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; text-align: center; margin: 0; padding: 20px; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; max-width: 420px; margin: 0 auto; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #334155; }
    input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; }
    input { background: #334155; color: #fff; text-align: center; }
    input::placeholder { color: #94a3b8; }
    button { background: #ef4444; color: white; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    .option-btn { margin: 8px 0; font-size: 18px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .option-btn:nth-child(1) { background: #ef4444; }
    .option-btn:nth-child(2) { background: #3b82f6; }
    .option-btn:nth-child(3) { background: #eab308; color: #000; }
    .option-btn:nth-child(4) { background: #22c55e; }
    #questionImg { max-width: 100%; height: auto; border-radius: 10px; margin: 12px 0; border: 2px solid #475569; }
    .hidden { display: none !important; }
    .badge { background: #3b82f6; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: normal; }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚡ Brand Speed Master</h2>

    <!-- Login -->
    <div id="loginSection">
      <p style="color: #94a3b8;">ใส่ชื่อเล่นเพื่อเข้าร่วมเกม</p>
      <input type="text" id="username" placeholder="เช่น ช่างภาพ01" maxlength="15">
      <button onclick="join()">เข้าร่วมเกม</button>
    </div>

    <!-- Waiting Room -->
    <div id="waitSection" class="hidden">
      <p class="badge">ห้องรอเล่นเกม</p>
      <h3>ยินดีต้อนรับคุณ <span id="displayName" style="color: #38bdf8;"></span>!</h3>
      <p style="color: #94a3b8;">กำลังรอ Host เปิดคำถามข้อต่อไป...</p>
      <hr style="border-color: #334155; margin: 20px 0;">
      <p>คะแนนสะสมของคุณ: <b id="myScore" style="color: #4ade80; font-size: 24px;">0</b></p>
    </div>

    <!-- Question View -->
    <div id="gameSection" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="badge" id="qBadge">ข้อที่ 1/10</span>
        <span id="timerText" style="color: #f43f5e; font-weight: bold;"></span>
      </div>
      <h3 id="qText" style="margin: 16px 0; font-size: 20px;"></h3>
      <img id="questionImg" src="" class="hidden">
      <div id="optionsContainer"></div>
    </div>

    <!-- Result View -->
    <div id="resultSection" class="hidden">
      <h3 id="resultMsg"></h3>
      <p id="correctAnswerText" style="color: #94a3b8;"></p>
      <hr style="border-color: #334155; margin: 20px 0;">
      <p>คะแนนรวมสะสม: <b id="totalScoreText" style="color: #4ade80; font-size: 24px;">0</b></p>
    </div>
  </div>

  <script>
    const socket = io();
    let myData = { score: 0, answeredCurrentQuestion: false };

    function join() {
      const name = document.getElementById('username').value.trim();
      if (name) socket.emit('joinGame', name);
    }

    socket.on('joinedSuccess', (player) => {
      myData = player;
      document.getElementById('displayName').innerText = player.name;
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('waitSection').classList.remove('hidden');
    });

    socket.on('errorMsg', (msg) => { alert(msg); });

    socket.on('newQuestion', (q) => {
      myData.answeredCurrentQuestion = false;
      document.getElementById('waitSection').classList.add('hidden');
      document.getElementById('resultSection').classList.add('hidden');
      document.getElementById('gameSection').classList.remove('hidden');

      document.getElementById('qBadge').innerText = `ข้อที่ ${q.questionIndex} /${q.totalQuestions}`;
      document.getElementById('qText').innerText = q.question;

      const img = document.getElementById('questionImg');
      if (q.hint) {
        img.src = q.hint;
        img.classList.remove('hidden');
      } else {
        img.classList.add('hidden');
      }

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          if (!myData.answeredCurrentQuestion) {
            myData.answeredCurrentQuestion = true;
            socket.emit('submitAnswer', idx);
            container.innerHTML = '<p style="color:#38bdf8; margin-top:20px;">✅ ส่งคำตอบแล้ว! กำลังรอสรุปผล...</p>';
          }
        };
        container.appendChild(btn);
      });
    });

    socket.on('answerResult', (res) => {
      myData.score = res.totalScore;
      document.getElementById('gameSection').classList.add('hidden');
      document.getElementById('resultSection').classList.remove('hidden');

      const msg = document.getElementById('resultMsg');
      if (res.correct) {
        msg.innerText = `🎉 ถูกต้อง! (+${res.pointsAdded} คะแนน)`;
        msg.style.color = '#4ade80';
      } else {
        msg.innerText = '❌ ตอบผิด!';
        msg.style.color = '#f43f5e';
      }
      document.getElementById('totalScoreText').innerText = res.totalScore;
      document.getElementById('myScore').innerText = res.totalScore;
    });

    socket.on('questionClosed', (data) => {
      document.getElementById('gameSection').classList.add('hidden');
      document.getElementById('resultSection').classList.remove('hidden');

      if (!myData.answeredCurrentQuestion) {
        document.getElementById('resultMsg').innerText = '⏰ หมดเวลา! คุณไม่ได้ส่งคำตอบ';
        document.getElementById('resultMsg').style.color = '#f43f5e';
      }
      document.getElementById('correctAnswerText').innerText = `เฉลย: ${data.correctOptionText}`;
    });

    socket.on('gameReset', () => {
      myData.score = 0;
      myData.answeredCurrentQuestion = false;
      document.getElementById('myScore').innerText = '0';
      document.getElementById('gameSection').classList.add('hidden');
      document.getElementById('resultSection').classList.add('hidden');
      document.getElementById('waitSection').classList.remove('hidden');
      alert('🔄 Host ได้สั่ง Reset เริ่มเกมใหม่!');
    });
  </script>
</body>
</html>
