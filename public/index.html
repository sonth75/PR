<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Host Dashboard - Brand Speed Master</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; padding: 24px; margin: 0; }
    h1 { margin-top: 0; color: #38bdf8; }
    .container { display: flex; gap: 24px; }
    .main-panel { flex: 2; background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; }
    .side-panel { flex: 1; background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; }
    button { padding: 14px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-right: 10px; margin-bottom: 10px; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-next { background: #3b82f6; color: white; }
    .btn-close { background: #ef4444; color: white; }
    .btn-reset { background: #64748b; color: white; }
    ol { font-size: 18px; line-height: 1.8; padding-left: 24px; }
    li { margin-bottom: 8px; }
    .badge-count { background: #22c55e; color: #000; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🎬 Host Dashboard (Brand Speed Master)</h1>
  <p>จำนวนผู้เล่นปัจจุบัน: <span class="badge-count" id="playerCount">0</span> / 100 คน</p>

  <div class="container">
    <div class="main-panel">
      <div>
        <button class="btn-next" onclick="nextQuestion()">▶️ เปิดคำถามข้อต่อไป</button>
        <button class="btn-close" onclick="closeQuestion()">⏹ จบเวลาข้อนี้</button>
        <button class="btn-reset" onclick="resetGame()">🔄 Reset เริ่มเกมใหม่</button>
      </div>

      <div id="hostQuestionDisplay" style="margin-top: 24px; padding: 20px; background: #0f172a; border-radius: 8px;">
        <h3>กด "เปิดคำถามข้อต่อไป" เพื่อเริ่มคำถามข้อแรก</h3>
      </div>
    </div>

    <div class="side-panel">
      <h2>🏆 Leaderboard Top 10</h2>
      <ol id="leaderboardList"></ol>
    </div>
  </div>

  <script>
    const socket = io();

    function nextQuestion() {
      socket.emit('adminNextQuestion');
    }

    function closeQuestion() {
      socket.emit('adminCloseQuestion');
    }

    function resetGame() {
      if (confirm('คุณแน่ใจหรือไม่ว่าต้องการ Reset คะแนนและเริ่มเกมใหม่ตั้งแต่ข้อแรก?')) {
        socket.emit('adminResetGame');
        document.getElementById('hostQuestionDisplay').innerHTML = '<h3>🔄 รีเซ็ตเกมเรียบร้อยแล้ว พร้อมสำหรับเริ่มรอบใหม่</h3>';
      }
    }

    socket.on('updatePlayerCount', (count) => {
      document.getElementById('playerCount').innerText = count;
    });

    socket.on('newQuestion', (q) => {
      document.getElementById('hostQuestionDisplay').innerHTML = `
        <h2 style="color: #38bdf8;">ข้อที่ ${q.questionIndex}/${q.totalQuestions}:${q.question}</h2>
        <p>เวลาต่อข้อ: <b>${q.timeLimit} วินาที</b></p>
        <ul>
          ${q.options.map((opt, idx) => `<li>ตัวเลือก ${idx + 1}: ${opt}</li>`).join('')}
        </ul>
      `;
    });

    socket.on('questionClosed', (data) => {
      document.getElementById('hostQuestionDisplay').innerHTML += `
        <h3 style="color: #ef4444; margin-top: 20px;">⏹ ปิดการรับคำตอบข้อนี้แล้ว</h3>
        <p style="color: #4ade80;">เฉลยข้อที่ถูกต้อง: <b>${data.correctOptionText}</b></p>
      `;
    });

    socket.on('updateLeaderboard', (topPlayers) => {
      const list = document.getElementById('leaderboardList');
      list.innerHTML = topPlayers.map(p => `<li>${p.name}: <b style="color: #38bdf8;">${p.score}</b> คะแนน</li>`).join('');
    });
  </script>
</body>
</html>
