<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Speed Master - Player</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif, system-ui; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background: #1e293b; border: 2px solid #38bdf8; border-radius: 16px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.2); }
    h1, h2 { text-align: center; color: #38bdf8; margin-bottom: 15px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; margin-bottom: 12px; }
    button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #0284c7; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    
    /* Options Grid */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .opt-btn { background: #334155; border: 2px solid #475569; padding: 12px; font-size: 15px; border-radius: 10px; cursor: pointer; color: white; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 60px; transition: 0.2s; }
    .opt-btn:hover { background: #475569; border-color: #38bdf8; }
    
    /* สไตล์เฉพาะสำหรับปุ่มที่เป็นรูปภาพ */
    .opt-btn.img-opt { padding: 6px; background: #0f172a; }
    .opt-btn.img-opt img { width: 100%; height: 100px; object-fit: contain; border-radius: 6px; }

    .timer-bar { width: 100%; background: #334155; height: 10px; border-radius: 5px; overflow: hidden; margin: 15px 0; }
    .timer-fill { background: #f59e0b; height: 100%; width: 100%; transition: width 1s linear; }
    .hint-img { width: 100%; max-height: 200px; object-fit: contain; border-radius: 8px; margin-bottom: 10px; }
    
    /* สไตล์ Leaderboard */
    .leaderboard-list { list-style: none; margin-top: 15px; }
    .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #334155; margin-bottom: 8px; border-radius: 8px; border: 1px solid transparent; font-size: 15px; }
    
    /* ไฮไลต์อันดับ 1 */
    .leaderboard-item.rank-1 { background: linear-gradient(90deg, #78350f, #334155); border-color: #f59e0b; font-weight: bold; }
    .leaderboard-item.rank-1 .rank-num { color: #fbbf24; font-size: 18px; }
    
    /* ไฮไลต์ผู้เล่นคนปัจจุบัน */
    .leaderboard-item.my-rank { border: 2px solid #38bdf8; background: #0284c7; font-weight: bold; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
    .leaderboard-item.my-rank .my-tag { font-size: 11px; background: #38bdf8; color: #0f172a; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: bold; }

    .rank-num { font-weight: bold; width: 45px; display: inline-block; color: #94a3b8; }
    .player-name { flex-grow: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .score-val { color: #38bdf8; font-weight: bold; }
    .rank-1 .score-val { color: #fbbf24; }
    .my-rank .score-val { color: #ffffff; }
    
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <!-- หน้าลงชื่อเข้าเล่น -->
    <div id="joinSection">
      <h1>⚡ BRAND SPEED MASTER</h1>
      <p style="text-align: center; color: #94a3b8; margin-bottom: 20px;">ใส่นามแฝงเพื่อเข้าร่วมการแข่งขัน</p>
      <input type="text" id="usernameInput" placeholder="พิมพ์ชื่อของคุณที่นี่..." maxlength="15">
      <button onclick="joinGame()">เข้าสู่เกม</button>
    </div>

    <!-- หน้าจอรอนับถอยหลัง -->
    <div id="waitSection" class="hidden" style="text-align: center;">
      <h2 id="playerNameDisplay">สวัสดีคุณ!</h2>
      <p style="color: #94a3b8; margin-top: 10px;">🎮 รอ Host เริ่มรันคำถาม...</p>
    </div>

    <!-- หน้าคำถาม -->
    <div id="gameSection" class="hidden">
      <div style="display: flex; justify-content: space-between; color: #94a3b8; font-size: 14px;">
        <span id="qCategory">ประเภท</span>
        <span id="qProgress">ข้อ 1/10</span>
      </div>

      <div class="timer-bar"><div id="timerFill" class="timer-fill"></div></div>
      
      <h2 id="questionText" style="font-size: 18px; text-align: left; color: #f8fafc;">คำถามจะปรากฏที่นี่</h2>
      <img id="hintImg" class="hint-img hidden" src="" alt="Hint">

      <div id="optionsContainer" class="options-grid"></div>
      <p id="statusMsg" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <!-- หน้าสรุปผลคะแนน Leaderboard -->
    <div id="leaderboardSection" class="hidden">
      <h2>🏆 ตารางคะแนนสูงสุด</h2>
      <ul id="leaderboardList" class="leaderboard-list"></ul>
    </div>
  </div>

  <script>
    const socket = io();
    let myPlayer = null;
    let currentTimeLimit = 10;

    function joinGame() {
      const name = document.getElementById('usernameInput').value.trim();
      if (name) {
        socket.emit('joinGame', name);
      }
    }

    socket.on('joinedSuccess', (player) => {
      myPlayer = player;
      document.getElementById('playerNameDisplay').innerText = `ผู้เล่น: ${player.name}`;
      document.getElementById('joinSection').classList.add('hidden');
      document.getElementById('waitSection').classList.remove('hidden');
    });

    socket.on('newQuestion', (data) => {
      document.getElementById('waitSection').classList.add('hidden');
      document.getElementById('gameSection').classList.remove('hidden');
      document.getElementById('statusMsg').innerText = '';

      document.getElementById('qProgress').innerText = `ข้อ ${data.qIndex + 1}/${data.total}`;
      document.getElementById('qCategory').innerText = data.question.type;
      document.getElementById('questionText').innerText = data.question.question;

      // แสดงรูปภาพคำใบ้ (ถ้ามี)
      const hintImg = document.getElementById('hintImg');
      if (data.question.hint) {
        hintImg.src = data.question.hint;
        hintImg.classList.remove('hidden');
      } else {
        hintImg.classList.add('hidden');
      }

      // สร้างตัวเลือกคำตอบ (แยกเคส ข้อความ หรือ รูปภาพ)
      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';
      
      data.question.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        
        if (data.question.optionType === 'image') {
          btn.className = 'opt-btn img-opt';
          btn.innerHTML = `<img src="${opt}" alt="Option ${idx + 1}">`;
        } else {
          btn.className = 'opt-btn';
          btn.innerText = opt;
        }

        btn.onclick = () => submitAnswer(idx, btn);
        optionsContainer.appendChild(btn);
      });

      currentTimeLimit = data.question.timeLimit;
    });

    function submitAnswer(idx, btnElement) {
      socket.emit('submitAnswer', { answerIndex: idx });
      
      // ปิดปุ่มตอบทั้งหมดชั่วคราว
      const btns = document.querySelectorAll('.opt-btn');
      btns.forEach(b => b.disabled = true);
      btnElement.style.borderColor = '#38bdf8';
      btnElement.style.background = '#0284c7';
      document.getElementById('statusMsg').innerText = 'ส่งคำตอบแล้ว รอสรุปผล...';
    }

    socket.on('answerResult', (res) => {
      const msg = document.getElementById('statusMsg');
      if (res.correct) {
        msg.innerText = `🎉 ถูกต้อง! (+${res.points} คะแนน)`;
        msg.style.color = '#4ade80';
      } else {
        msg.innerText = `❌ คำตอบไม่ถูกต้อง`;
        msg.style.color = '#f87171';
      }
    });

    socket.on('timerUpdate', (timeLeft) => {
      const fill = document.getElementById('timerFill');
      const pct = (timeLeft / currentTimeLimit) * 100;
      fill.style.width = `${pct}%`;
    });

    // อัปเดตตาราง Leaderboard พร้อมแสดงอันดับและไฮไลต์
    socket.on('updateLeaderboard', (list) => {
      const lbList = document.getElementById('leaderboardList');
      lbList.innerHTML = '';

      list.forEach((item, index) => {
        const rank = index + 1;
        const li = document.createElement('li');
        
        let rankClass = 'leaderboard-item';
        let rankIcon = `#${rank}`;
        let isMe = myPlayer && item.id === myPlayer.id;

        if (rank === 1) {
          rankClass += ' rank-1';
          rankIcon = '🏆 #1';
        }

        if (isMe) {
          rankClass += ' my-rank';
        }

        li.className = rankClass;
        li.innerHTML = `
          <span class="rank-num">${rankIcon}</span>
          <span class="player-name">${item.name} ${isMe ? '<span class="my-tag">คุณ</span>' : ''}</span>
          <span class="score-val">${item.score} pts</span>
        `;
        
        lbList.appendChild(li);
      });
    });

    socket.on('gameOver', () => {
      document.getElementById('gameSection').classList.add('hidden');
      document.getElementById('leaderboardSection').classList.remove('hidden');
    });

    socket.on('resetClientState', () => {
      document.getElementById('gameSection').classList.add('hidden');
      document.getElementById('leaderboardSection').classList.add('hidden');
      document.getElementById('waitSection').classList.remove('hidden');
    });
  </script>
</body>
</html>
